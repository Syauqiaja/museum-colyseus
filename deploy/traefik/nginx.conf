# nginx for the `web` container — lives at /docker/museum/nginx.conf on the VPS,
# mounted as /etc/nginx/conf.d/default.conf. Serves the Unity WebGL build from
# /docker/museum/site (mounted at /usr/share/nginx/html).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Traefik terminates TLS and forwards plain HTTP here.
    # No gzip: the payload is pre-compressed Brotli and the build has no
    # decompression fallback, so Content-Encoding: br is mandatory.
    gzip off;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Build filenames are stable across builds (WebGL.data.br), so never "immutable":
    # nginx sends ETag + Last-Modified and the browser revalidates for free (304).
    location ~ \.data\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/octet-stream;
    }

    location ~ \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/wasm;
    }

    location ~ \.js\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=0, must-revalidate";
        default_type application/javascript;
    }

    location ~ \.wasm$ {
        default_type application/wasm;
    }
}
