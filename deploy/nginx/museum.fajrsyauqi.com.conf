# Museum Minigames — Nginx site config
#
# Install on the VPS as:
#   /etc/nginx/sites-available/museum.fajrsyauqi.com.conf
#   ln -s ../sites-available/museum.fajrsyauqi.com.conf /etc/nginx/sites-enabled/
#
# Both server blocks listen on :80 only. Run certbot afterwards; it rewrites
# these blocks in place to add the TLS listeners and the http->https redirect:
#   certbot --nginx -d museum.fajrsyauqi.com -d api.museum.fajrsyauqi.com
#
# See deploy/README.md for the full runbook.

# Required so proxied WebSocket upgrades survive. `map` is http-context, which
# is where sites-enabled/* gets included, so defining it here is fine — but only
# once across all site files. If another site already defines
# $connection_upgrade, delete this block.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Client — Unity WebGL static build
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name museum.fajrsyauqi.com;

    root /var/www/museum;
    index index.html;

    # The WebGL payload is large and content-hashed per build. Long-cache the
    # Build/ directory, never cache index.html, so a redeploy takes effect.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Unity WebGL with Compression Format = Brotli emits pre-compressed files
    # named *.unityweb. Nginx must NOT re-compress them; it must declare the
    # encoding so the browser inflates them. Without these headers the loader
    # fails with "Unable to parse Build/WebGL.data.unityweb".
    #
    # Order matters: the more specific .js/.wasm locations must come before the
    # catch-all .unityweb one, so keep them as written.
    location ~ \.data\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
        gzip off;
    }

    location ~ \.framework\.js\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
        gzip off;
    }

    location ~ \.wasm\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
        gzip off;
    }

    location /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ?room=CODE deep links are handled client-side; always serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Large build, slow museum uplinks — don't cut transfers short.
    client_max_body_size 1m;
    send_timeout 300s;
}

# ---------------------------------------------------------------------------
# API — Colyseus (WebSocket + matchmaking HTTP)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.museum.fajrsyauqi.com;

    # Colyseus ships no CORS handling of its own (verified against
    # @colyseus/tools 0.17 and colyseus 0.17 — no Access-Control-* anywhere),
    # and matchmaking is a cross-origin HTTP POST from the client host before
    # the socket ever opens. Without this, joinOrCreate fails in-browser while
    # working fine in the Editor.
    set $cors_origin "";
    if ($http_origin ~* ^https://museum\.fajrsyauqi\.com$) {
        set $cors_origin $http_origin;
    }

    location / {
        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
        add_header Vary Origin always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Colyseus rooms idle between moves (Dakon is turn-based — a player can
        # think for minutes). Default 60s proxy_read_timeout would kill the
        # socket mid-game.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # The Colyseus monitor panel lists and can destroy live rooms. It is also
    # gated server-side by MONITOR_ENABLED (see src/app.config.ts); this is the
    # second lock. Create the password file with:
    #   htpasswd -c /etc/nginx/.htpasswd-museum admin
    location /monitor {
        auth_basic "Museum Minigames monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-museum;

        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
