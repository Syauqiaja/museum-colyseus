# Museum Minigames — Nginx site config
#
# Install on the VPS (from the repo root):
#   sudo mkdir -p /var/www/museum
#   sudo cp deploy/nginx/museum.fajrsyauqi.com.conf /etc/nginx/sites-available/
#   sudo ln -s ../sites-available/museum.fajrsyauqi.com.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: these blocks assume the certificate ALREADY EXISTS at
# /etc/letsencrypt/live/museum.fajrsyauqi.com/. Issue it before installing this
# file:
#   sudo certbot --nginx -d museum.fajrsyauqi.com -d api.museum.fajrsyauqi.com
#
# Do not let certbot rewrite this file afterwards (`certbot --nginx` again) — it
# appends duplicate 443 blocks. Renewal alone (`certbot renew`) never touches
# site configs, only the certificate files these blocks point at.
#
# See deploy/README.md for the full runbook.

# Required so proxied WebSocket upgrades survive. `map` is http-context, which
# is where sites-enabled/* gets included, so defining it here is fine — but only
# once across all site files. This VPS also hosts qurantv_webrtc; if that (or
# any other site) already defines $connection_upgrade, delete this block:
#   grep -rn connection_upgrade /etc/nginx/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---------------------------------------------------------------------------
# Client — Unity WebGL static build
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name museum.fajrsyauqi.com;

    ssl_certificate     /etc/letsencrypt/live/museum.fajrsyauqi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/museum.fajrsyauqi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/museum;
    index index.html;

    # The WebGL payload is large and content-hashed per build. Long-cache the
    # Build/ directory, never cache index.html, so a redeploy takes effect.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Pre-compressed Unity build files. Nginx must NOT re-compress them; it must
    # declare the encoding so the browser inflates them. Without these headers
    # the loader fails with "Unable to parse Build/WebGL.data.unityweb" (or
    # stalls on the progress bar).
    #
    # Which filenames you get depends on Player Settings → Publishing Settings:
    #   Compression Brotli + Decompression Fallback ON  -> *.unityweb
    #   Compression Brotli + Decompression Fallback OFF -> *.br
    #   Compression Gzip   + Decompression Fallback OFF -> *.gz
    # Both naming schemes are handled below, so either build setting works.
    #
    # Order matters: the specific .js/.wasm locations must come before each
    # catch-all, and regex locations are matched in order of appearance.
    location ~ \.data\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
        gzip off;
    }

    location ~ \.framework\.js\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
        gzip off;
    }

    location ~ \.wasm\.unityweb$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
        gzip off;
    }

    location ~ \.wasm\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
        gzip off;
    }

    location ~ \.js\.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
        gzip off;
    }

    location ~ \.br$ {
        add_header Content-Encoding br;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
        gzip off;
    }

    location ~ \.wasm\.gz$ {
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/wasm;
        gzip off;
    }

    location ~ \.js\.gz$ {
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/javascript;
        gzip off;
    }

    location ~ \.gz$ {
        add_header Content-Encoding gzip;
        add_header Cache-Control "public, max-age=31536000, immutable";
        default_type application/octet-stream;
        gzip off;
    }

    # ^~ so uncompressed builds under Build/ still get the long cache without
    # being intercepted by the regex blocks above (regex wins over plain prefix,
    # but ^~ wins over regex).
    location ^~ /Build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ?room=CODE deep links are handled client-side; always serve the shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Large build, slow museum uplinks — don't cut transfers short.
    client_max_body_size 1m;
    send_timeout 300s;
}

# ---------------------------------------------------------------------------
# API — Colyseus (WebSocket + matchmaking HTTP)
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.museum.fajrsyauqi.com;

    ssl_certificate     /etc/letsencrypt/live/museum.fajrsyauqi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/museum.fajrsyauqi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # NO CORS headers here on purpose. Colyseus sets its own on every matchmaking
    # response (@colyseus/core router/node.ts -> DEFAULT_CORS_HEADERS +
    # controller.getCorsHeaders, defaulting to the request's Origin), including
    # the OPTIONS preflight. Adding them in nginx too produces two
    # Access-Control-Allow-Origin headers, which browsers reject outright with
    # "contains multiple values". To restrict the allowed origin, override
    # matchMaker.controller.getCorsHeaders in src/app.config.ts instead.

    location / {
        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;

        # WebSocket upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Colyseus rooms idle between moves (Dakon is turn-based — a player can
        # think for minutes). Default 60s proxy_read_timeout would kill the
        # socket mid-game.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        proxy_buffering off;
    }

    # The Colyseus monitor panel lists and can destroy live rooms. It is also
    # gated server-side by MONITOR_ENABLED (see src/app.config.ts); this is the
    # second lock. Create the password file with:
    #   sudo htpasswd -c /etc/nginx/.htpasswd-museum admin
    location /monitor {
        auth_basic "Museum Minigames monitor";
        auth_basic_user_file /etc/nginx/.htpasswd-museum;

        proxy_pass http://127.0.0.1:2567;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ---------------------------------------------------------------------------
# HTTP -> HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name museum.fajrsyauqi.com api.museum.fajrsyauqi.com;
    return 301 https://$host$request_uri;
}
